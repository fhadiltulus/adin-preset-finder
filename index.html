<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adin Preset Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b1c;--panel:#0b1736;--line:#1a2d5a;--ink:#e7eeff;--mute:#8fa3d1;--acc:#4da3ff;--acc2:#1f6fe0}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 400px at 50% -10%,#10265a,transparent),var(--bg);color:var(--ink);font:15px/1.5 Sora,system-ui,sans-serif;min-height:100vh;padding:20px 16px 48px}
main{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0 4px;font-weight:700;font-size:20px}
.brand svg{width:34px;height:34px}
.sub{text-align:center;color:var(--mute);font-size:13px;margin-bottom:28px}
h1{font-size:26px;line-height:1.2;margin-bottom:8px}
.lead{color:var(--mute);font-size:14px;margin-bottom:16px}
.row{display:flex;gap:8px}
.field{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:0}
.field:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px #4da3ff33}
input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;padding:13px 0;outline:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.go{background:var(--acc);color:#04122e;font-weight:700;padding:0 18px}
.go:disabled{opacity:.6}
.ghost{background:none;color:var(--mute);padding:4px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 0;padding-bottom:4px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:4px 12px;font:12px 'JetBrains Mono',monospace;white-space:nowrap}
.state{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--mute);display:flex;gap:10px;align-items:center}
.state.err{color:#ff9aa8;border-color:#5b2331}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.vid{display:flex;gap:12px;margin-top:22px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.vid img{width:72px;height:96px;object-fit:cover;border-radius:8px;background:#0e2250}
.vid b{display:block;font-size:14px}
.vid p{color:var(--mute);font-size:12.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--acc)}
h2{font-size:17px;margin:24px 0 10px;display:flex;gap:8px;align-items:center}
h2 span{background:var(--acc2);border-radius:99px;font-size:12px;padding:1px 9px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;margin-bottom:10px}
.card .top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.badge{font:600 11px 'JetBrains Mono',monospace;border:1px solid var(--acc);color:var(--acc);border-radius:6px;padding:1px 7px}
.badge.xml{border-color:#5fd4c4;color:#5fd4c4}
.src{color:var(--mute);font-size:12px}
.link{font:12px 'JetBrains Mono',monospace;color:#9db6e6;word-break:break-all;margin-bottom:12px}
.act{display:flex;gap:8px}
.act a,.act button{padding:9px 16px;font-size:14px;border-radius:10px;text-decoration:none;text-align:center}
.act a{background:var(--acc);color:#04122e;font-weight:700}
.act button{background:none;border:1px solid var(--line);color:var(--ink)}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:36px}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 40 40" fill="none"><rect x="2" y="2" width="36" height="36" rx="10" fill="#0b1736" stroke="#4da3ff" stroke-width="2"/><path d="M12 28 20 11l8 17M15.5 22h9" stroke="#4da3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Adin Preset Finder
  </div>
  <p class="sub">Cari preset Alight Motion dari link TikTok mana pun</p>

  <h1>Cari link preset</h1>
  <p class="lead">Tempel link video TikTok. Deskripsi, bio akun, komentar, dan balasan akan dipindai otomatis.</p>

  <div class="row">
    <div class="field">
      <input id="url" placeholder="https://vt.tiktok.com/xxx" inputmode="url" autocomplete="off">
      <button class="ghost" id="paste" aria-label="Tempel dari clipboard">Tempel</button>
    </div>
    <button class="go" id="go">Cari</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="out"></div>
  <footer>Dibuat oleh Adin</footer>
</main>
<script>
const $=id=>document.getElementById(id), out=$("out");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"jt":n>=1e3?(n/1e3).toFixed(1)+"rb":n;
let hist=[];try{hist=JSON.parse(localStorage.getItem("hist")||"[]")}catch(e){}
function chips(){$("chips").innerHTML=hist.map(h=>`<button class="chip" data-u="${esc(h)}">${esc(h.replace(/^https?:\/\//,""))}</button>`).join("")}
$("chips").onclick=e=>{const u=e.target.dataset.u;if(u){$("url").value=u;search()}};
$("paste").onclick=async()=>{try{$("url").value=await navigator.clipboard.readText()}catch(e){$("url").focus()}};
$("url").onkeydown=e=>{if(e.key==="Enter")search()};
$("go").onclick=search;
async function search(){
  const url=$("url").value.trim();
  if(!/tiktok\.com/i.test(url)){out.innerHTML='<div class="state err">Masukkan link TikTok yang valid.</div>';return}
  $("go").disabled=true;$("go").textContent="Mencari";
  out.innerHTML='<div class="state"><div class="spin"></div>Memindai deskripsi, bio, komentar, dan balasan…</div>';
  try{
    const r=await fetch("/api/search?url="+encodeURIComponent(url));
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Gagal mencari.");
    hist=[url,...hist.filter(h=>h!==url)].slice(0,5);localStorage.setItem("hist",JSON.stringify(hist));chips();
    render(d);
  }catch(e){out.innerHTML=`<div class="state err">${esc(e.message)}</div>`}
  $("go").disabled=false;$("go").textContent="Cari";
}
function render({video:v,results:rs}){
  let h=`<div class="vid">${v.cover?`<img src="${esc(v.cover)}" alt="">`:""}<div><b>@${esc(v.author)}</b><p>${esc(v.title)}</p><div class="stats"><span>${fmt(v.views)} views</span><span>${fmt(v.likes)} likes</span><span>${fmt(v.comments)} komentar</span></div></div></div>`;
  if(!rs.length)h+='<div class="state">Tidak ada link preset di video ini. Coba video lain.</div>';
  else{
    h+=`<h2>Link preset <span>${rs.length}</span></h2>`;
    rs.forEach((x,i)=>{
      const xml=x.type==="xml";
      h+=`<div class="card"><div class="top"><span class="badge ${xml?"xml":""}">${xml?"XML":"5MB"}</span><span class="src">dari ${x.source}${x.by?" · @"+esc(x.by):""}</span></div><div class="link">${esc(x.url)}</div><div class="act"><a href="${esc(x.url)}" target="_blank" rel="noopener">${xml?"Ambil file":"Buka preset"}</a><button data-c="${esc(x.url)}">Salin link</button></div></div>`;
    });
  }
  out.innerHTML=h;
}
out.onclick=async e=>{const c=e.target.dataset.c;if(!c)return;try{await navigator.clipboard.writeText(c);e.target.textContent="Tersalin"}catch(_){e.target.textContent="Gagal"}setTimeout(()=>e.target.textContent="Salin link",1500)};
chips();
</script>
</body>
</html>
